<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polar Breakout</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07070a; overflow: hidden; }
      canvas { display: block; touch-action: none; cursor: crosshair; }
      .hud { position: fixed; left: 16px; right: 16px; top: 14px; display: flex; gap: 20px; color: #e9e4da; font: 13px ui-monospace, Menlo, monospace; pointer-events: none; }
      .hud b { font-weight: 400; opacity: 0.5; margin-right: 6px; }
      .hud .fx { margin-left: auto; color: #ffd23c; }
      .foot { position: fixed; left: 16px; bottom: 16px; color: #e9e4da; font: 13px ui-monospace, Menlo, monospace; opacity: 0.7; }
      .foot a { color: inherit; text-decoration: none; margin-right: 12px; }
      .legend span { margin-right: 10px; }
      #msg { position: fixed; inset: 0; display: grid; place-items: center; color: #f2efe8; font: 15px ui-monospace, Menlo, monospace; letter-spacing: 0.04em; pointer-events: none; transition: opacity 0.3s; }
    </style>
  </head>
  <body>
    <div class="hud">
      <span><b>score</b><span id="score">0</span></span>
      <span><b>level</b><span id="level">1</span></span>
      <span id="lives"></span>
      <span class="fx" id="fx"></span>
    </div>
    <div id="msg"></div>
    <div class="foot">
      <a href="/">← lab</a>
      <span class="legend">
        <span style="color: #3cc8ff">■ slow</span>
        <span style="color: #ff3cc8">■ triple</span>
        <span style="color: #ffd23c">■ magnet</span>
        <span style="color: #8a8a96">■ solid</span>
      </span>
      <span>pointer or a/d to steer · click or space to serve</span>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
