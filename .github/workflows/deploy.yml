name: deploy

# One workflow, three environments, chosen by branch:
#   dev → dev.aninir.com   staging → staging.aninir.com   master → aninir.com
# Each job runs in a GitHub Environment of the same name, which holds that
# environment's LAB_DEPLOY_TOKEN (secret) and LAB_API (variable).
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are repository secrets shared by all.
on:
  push:
    branches: [master, staging, dev]
  workflow_dispatch:
    inputs:
      projects:
        description: Space-separated project folders to deploy (e.g. "shader-garden archive")
        required: false

concurrency: deploy-${{ github.ref_name }}

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.name }}
      platform: ${{ steps.filter.outputs.changes }}
      projects: ${{ steps.projects.outputs.list }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: env
        name: Environment for this branch
        run: |
          case "$GITHUB_REF_NAME" in
            master) echo "name=production" >> "$GITHUB_OUTPUT" ;;
            staging | dev) echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
            *) echo "no environment for $GITHUB_REF_NAME" && exit 1 ;;
          esac
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api: [apps/api/**, packages/lab-core/**]
            web: [apps/web/**, apps/api/src/**, packages/lab-core/**]
            edge: [apps/edge/**, packages/lab-core/**]
      - id: projects
        name: Changed projects
        env:
          REQUESTED: ${{ inputs.projects }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$REQUESTED" ]; then
            dirs="$REQUESTED"
          else
            dirs=$(git diff --name-only "$BEFORE" HEAD -- projects | cut -d/ -f2 | sort -u)
          fi
          list=$(for d in $dirs; do [ -f "projects/$d/lab.json" ] && echo "$d"; done | jq -Rcn '[inputs]')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  platform:
    needs: plan
    if: needs.plan.outputs.platform != '[]'
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy changed Workers
        run: |
          parts=$(echo '${{ needs.plan.outputs.platform }}' | jq -r 'join(" ")')
          ./scripts/deploy-platform.sh "${{ needs.plan.outputs.environment }}" $parts

  projects:
    needs: [plan, platform]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.projects != '[]' && needs.platform.result != 'failure'
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.plan.outputs.projects) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (if the project has a build script)
        run: pnpm --filter "./projects/${{ matrix.project }}" --if-present build
      - name: Deploy
        env:
          LAB_API: ${{ vars.LAB_API }}
          LAB_DEPLOY_TOKEN: ${{ secrets.LAB_DEPLOY_TOKEN }}
        run: pnpm lab deploy "projects/${{ matrix.project }}"
